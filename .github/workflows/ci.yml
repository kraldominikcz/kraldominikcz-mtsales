name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typy, testy, migrace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtsales
          POSTGRES_PASSWORD: mtsales
          POSTGRES_DB: mtsales_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mtsales"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://mtsales:mtsales@localhost:5432/mtsales_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kontrola typů
        run: pnpm typecheck
      - name: Testy
        run: pnpm test
      - name: Migrace odpovídají schématu
        run: |
          pnpm --filter @mtsales/db generate
          git diff --exit-code -- packages/db/migrations || (echo "::error::Schéma DB se změnilo bez migrace. Spusť pnpm db:generate a commitni migraci." && exit 1)
          test -z "$(git status --porcelain -- packages/db/migrations)" || (echo "::error::Chybí commit nové migrace." && exit 1)
      - name: Sestavení webu
        run: pnpm --filter @mtsales/app export:web
        env:
          EXPO_OFFLINE: 1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -f apps/api/Dockerfile -t mtsales-api .
      - name: Web image
        run: docker build -f infra/web.Dockerfile -t mtsales-web .
